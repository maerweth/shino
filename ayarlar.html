<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayarlar - Shino</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    .ayarlar-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 40px;
    }
    .ayarlar-baslik {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }
    .ayarlar-baslik h1 {
      font-size: 36px;
      font-weight: 800;
      color: white;
    }
    .ayarlar-baslik span {
      font-size: 32px;
    }
    .ayarlar-aciklama {
      color: #7ab3cc;
      font-size: 14px;
      margin-bottom: 40px;
    }
    .ayarlar-ici {
      display: flex;
      gap: 24px;
    }
    .ayarlar-menu {
      width: 240px;
      flex-shrink: 0;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      color: #7ab3cc;
      transition: background 0.2s;
    }
    .menu-item.aktif {
      background: rgba(255,255,255,0.08);
      color: white;
      border-left: 3px solid #00d4ff;
      font-weight: 600;
    }
    .menu-item:hover:not(.aktif) {
      background: rgba(255,255,255,0.04);
    }
    .ayarlar-panel {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 36px;
    }
    .panel-baslik {
      font-size: 28px;
      font-weight: 800;
      color: white;
      margin-bottom: 8px;
    }
    .panel-aciklama {
      color: #7ab3cc;
      font-size: 13px;
      margin-bottom: 32px;
    }
    .input-grup {
      margin-bottom: 20px;
    }
    .input-label {
      display: block;
      color: #ccc;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 0 14px;
      height: 50px;
      gap: 10px;
    }
    .input-wrapper:focus-within {
      border-color: #00d4ff;
    }
    .input-wrapper span {
      font-size: 16px;
      opacity: 0.6;
    }
    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 14px;
      font-family: 'Exo 2', sans-serif;
    }
    .input-wrapper input::placeholder {
      color: #4a6a7a;
    }
    .goz-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      opacity: 0.5;
      color: white;
      transition: opacity 0.2s;
    }
    .goz-btn:hover {
      opacity: 1;
    }
    .degistir-btn {
      width: 100%;
      background: #00d4ff;
      color: #0a0f1e;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      font-family: 'Exo 2', sans-serif;
      transition: background 0.2s;
    }
    .degistir-btn:hover {
      background: #00b8d9;
    }
    .mesaj {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 16px;
      text-align: center;
    }
    .mesaj.basari {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #10b981;
    }
    .mesaj.hata {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #ef4444;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo-alan">
    <div class="logo-ikon">🎮</div>
    <div>
      <div class="logo-yazi">shino</div>
      <div class="logo-alt">Güvenli Oyun Yönetimi</div>
    </div>
  </div>
  <div class="nav-linkler" style="margin-left:80px;">
    <a href="index.html" class="nav-link">🏠 Ana Sayfa</a>
    <a href="oyunlar.html" class="nav-link">🎮 Oyunlar</a>
    <a href="nasil-calisir.html" class="nav-link">❓ Nasıl Çalışır?</a>
  </div>
  <div class="nav-buttons" id="navButtons">
    <button class="btn-login" onclick="window.location.href='index.html'">Giriş Yap</button>
    <button class="btn-register" onclick="window.location.href='index.html'">Kayıt Ol</button>
  </div>
</nav>

<div class="ayarlar-container">
  <div class="ayarlar-baslik">
    <span>⚙️</span>
    <h1>Ayarlar</h1>
  </div>
  <p class="ayarlar-aciklama">Hesap ayarlarınızı buradan yönetebilirsiniz</p>

  <div class="ayarlar-ici">
    <div class="ayarlar-menu">
      <div class="menu-item aktif">🔒 Şifre Değiştirme</div>
    </div>

    <div class="ayarlar-panel">
      <div class="panel-baslik">Şifre Değiştirme</div>
      <p class="panel-aciklama">Hesabınızın güvenliği için düzenli olarak şifrenizi değiştirmenizi öneririz</p>

      <div class="input-grup">
        <label class="input-label">Mevcut Şifre</label>
        <div class="input-wrapper">
          <span>🔒</span>
          <input type="password" id="mevcutSifre" placeholder="Mevcut şifrenizi girin">
          <button class="goz-btn" onclick="toggleGoz('mevcutSifre')">👁️</button>
        </div>
      </div>

      <div class="input-grup">
        <label class="input-label">Yeni Şifre</label>
        <div class="input-wrapper">
          <span>🔒</span>
          <input type="password" id="yeniSifre" placeholder="Yeni şifrenizi girin">
          <button class="goz-btn" onclick="toggleGoz('yeniSifre')">👁️</button>
        </div>
      </div>

      <div class="input-grup">
        <label class="input-label">Yeni Şifre (Tekrar)</label>
        <div class="input-wrapper">
          <span>🔒</span>
          <input type="password" id="yeniSifreTekrar" placeholder="Yeni şifrenizi tekrar girin">
          <button class="goz-btn" onclick="toggleGoz('yeniSifreTekrar')">👁️</button>
        </div>
      </div>

      <button class="degistir-btn" onclick="sifreDegistir()">Şifreyi Değiştir</button>
      <div class="mesaj" id="mesaj"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
  function toggleGoz(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  async function sifreDegistir() {
    const yeni = document.getElementById('yeniSifre').value;
    const tekrar = document.getElementById('yeniSifreTekrar').value;
    const mesaj = document.getElementById('mesaj');

    if (!yeni || !tekrar) {
      mesaj.className = 'mesaj hata';
      mesaj.style.display = 'block';
      mesaj.innerText = 'Lütfen tüm alanları doldurun!';
      return;
    }

    if (yeni !== tekrar) {
      mesaj.className = 'mesaj hata';
      mesaj.style.display = 'block';
      mesaj.innerText = 'Yeni şifreler eşleşmiyor!';
      return;
    }

    const { error } = await supabaseClient.auth.updateUser({ password: yeni });

    if (error) {
      mesaj.className = 'mesaj hata';
      mesaj.style.display = 'block';
      mesaj.innerText = 'Hata: ' + error.message;
    } else {
      mesaj.className = 'mesaj basari';
      mesaj.style.display = 'block';
      mesaj.innerText = '✅ Şifreniz başarıyla değiştirildi!';
      document.getElementById('mevcutSifre').value = '';
      document.getElementById('yeniSifre').value = '';
      document.getElementById('yeniSifreTekrar').value = '';
    }
  }
</script>
</body>
</html>
