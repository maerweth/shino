<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamePort</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="logo" id="logoAlan"></div>
  <div class="nav-buttons">
    <button class="btn-login" id="loginBtn-open">Giriş Yap</button>
    <button class="btn-register" id="registerBtn-open">Kayıt Ol</button>
  </div>
</nav>

<div class="search-bar">
  <span class="search-icon">🔍</span>
  <input type="text" class="search-input" placeholder="Kod'u veya oyunu aratın.">
</div>

  <div class="games-section">
    <h2 class="section-title">Öne Çıkan Oyunlar</h2>
    <div class="games-grid">

<div class="game-card">
  <div class="game-img">
    <img src="https://cdn.itemsatis.com/uploads/post_images/subnautica-2-6080593.png" alt="Subnautica 2">
  </div>
  <div class="game-info">
    <div class="game-name">Subnautica 2</div>
    <div class="game-tag">Hayatta Kalma</div>
  </div>
  <a href="https://store.steampowered.com/app/1962700/Subnautica_2/" target="_blank"><button class="game-btn">İncele</button></a>
</div>

<div class="game-card">
  <div class="game-img">
    <img src="https://images.hepsiburada.net/description-assets/description-prod-30/4452b4c6-6ddd-4fd5-a111-750de34d7a4c.jpg" alt="GTA V">
  </div>
  <div class="game-info">
    <div class="game-name">Gta V</div>
    <div class="game-tag">Rol Yapma</div>
  </div>
  <a href="https://store.steampowered.com/app/3240220/Grand_Theft_Auto_V_Enhanced/" target="_blank"><button class="game-btn">İncele</button></a>
</div>

<div class="game-card">
  <div class="game-img">
    <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/242760/capsule_616x353.jpg?t=1699381053" alt="The Forest">
  </div>
  <div class="game-info">
    <div class="game-name">The Forest</div>
    <div class="game-tag">Hayatta Kalma</div>
  </div>
    <a href="https://store.steampowered.com/app/242760/The_Forest/" target="_blank"><button class="game-btn">İncele</button></a>
</div>

    </div>
  </div>

<!-- GİRİŞ EKRANI -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" id="closeLogin">✕</button>
    <h2 class="modal-title">Giriş Yap</h2>

    <label class="input-label">Kullanıcı Adı</label>
    <input type="text" class="input-box" id="username" placeholder="Kullanıcı adınızı girin">

    <label class="input-label">Şifre</label>
    <input type="password" class="input-box" id="password" placeholder="Şifrenizi girin">

    <button class="modal-btn" id="loginBtn">Giriş Yap</button>
    <p class="forgot-password">Şifrenizi mi unuttunuz?</p>
  </div>
</div>

<!-- KAYIT OL EKRANI -->
<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <button class="modal-close" id="closeRegister">✕</button>
    <h2 class="modal-title">Kayıt Ol</h2>

    <label class="input-label">Kullanıcı Adı / Gmail</label>
    <input type="text" class="input-box" id="reg-username" placeholder="Kullanıcı adı veya Gmail girin">

    <label class="input-label">Şifre</label>
    <input type="password" class="input-box" id="reg-password" placeholder="Şifrenizi girin">

    <button class="modal-btn" id="registerBtn">Kayıt Ol</button>
  </div>
</div>
  <div id="successMessage" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; color:#8b5cf6; padding:40px 60px; border-radius:16px; font-size:22px; font-weight:bold; z-index:9999; box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align:center;">
    Başarıyla giriş yapıldı!
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
